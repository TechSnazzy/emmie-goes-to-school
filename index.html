<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#1b1526" />
<title>Emmie Goes to School</title>
<meta name="description" content="A friendly little game: help Emmie get ready and walk to class." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%8E%92%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- top bar: never overlaps the 3D view -->
  <header id="topbar">
    <div id="sun">
      <span class="sun-dot">☀</span>
      <div class="bar"><div id="sunfill"></div></div>
      <span class="lbl">morning</span>
    </div>
    <div id="obj"></div>
    <div id="audiobtns">
      <button id="btn-music" data-icon="♪ music">♪ music</button>
      <button id="btn-sfx" data-icon="🔊 sounds">🔊 sounds</button>
    </div>
  </header>

  <div id="main">
    <!-- the whole 3D gameplay view, nothing drawn on top of it -->
    <div id="view">
      <canvas id="view3d"></canvas>
      <canvas id="ui" width="640" height="360"></canvas>
      <div id="toast"></div>
    </div>

    <!-- the checklist lives beside the view, never over it -->
    <aside id="panel">
      <h3 id="panel-title">Getting Ready</h3>
      <ul id="panel-list"></ul>
      <p id="panel-hint"><b>Click where Emmie should go.</b><br />She walks there and does the job by herself.</p>
    </aside>
  </div>

  <div id="touch" hidden>
    <div class="dpad">
      <button id="t-up" aria-label="up">▲</button>
      <div class="row">
        <button id="t-left" aria-label="left">◀</button>
        <button id="t-down" aria-label="down">▼</button>
        <button id="t-right" aria-label="right">▶</button>
      </div>
    </div>
    <button id="t-act" class="big" aria-label="do it">Z</button>
  </div>
</div>

<script>
window.addEventListener('error', (e) => {
  const d = document.createElement('pre');
  d.style.cssText = 'position:fixed;inset:0;margin:0;padding:12px;color:#fff;background:#711;font:12px/1.5 monospace;white-space:pre-wrap;z-index:99;overflow:auto';
  d.textContent = 'ERROR: ' + e.message + '\n' + (e.filename || '') + ':' + e.lineno + '\n\n' + ((e.error && e.error.stack) || '');
  document.body.appendChild(d);
});
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
